<div class="st-layout">

  <aside class="menu-lateral">
    <div class="marque">
      <div class="logo">
        <img src="biat.png" alt="Logo BIAT IT" class="logo-img"></div>
    </div>

    <div class="text-logo">
    <h1>BIAT <span class="it">IT</span></h1>
    </div>

    <nav class="liens">
      <a routerLink="/stagiaire" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">
        <span class="ico">🏠</span> Tableau de bord
      </a>
      <a routerLink="/stagiaire/profil" routerLinkActive="actif">
        <span class="ico">👤</span> Mon profil
      </a>
      <a routerLink="/stagiaire/sujet" routerLinkActive="actif">
        <span class="ico">🎯</span> Mon sujet
      </a>
      <a routerLink="/stagiaire/messagerie" routerLinkActive="actif">
        <span class="ico">💬</span> Messagerie
        @if (messagesNonLus > 0) {
          <span class="compteur">{{ messagesNonLus }}</span>
        }
      </a>
      <a routerLink="/stagiaire/avancement" routerLinkActive="actif">
        <span class="ico">📈</span> Mon avancement
      </a>
    </nav>

    <div class="bas">
      @if (utilisateur) {
        <div class="profil">
          <div class="avatar">{{ utilisateur.username.charAt(0).toUpperCase() }}</div>
          <div>
            <strong>{{ utilisateur.username }}</strong>
            <span>Stagiaire</span>
          </div>
        </div>
      }
      <button (click)="seDeconnecter()">Se déconnecter</button>
    </div>
  </aside>

  <main class="principal">
    <div class="zone">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
